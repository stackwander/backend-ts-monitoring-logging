apiVersion: 1

datasources:
  - name: P4 Prometheus
    uid: p4-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: P4 Loki
    uid: p4-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
